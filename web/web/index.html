<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>lca web</title>
<style>
:root{--bg:#0e1116;--fg:#e6edf3;--dim:#8b949e;--acc:#3fb950;--bad:#f85149;--card:#161b22}
*{box-sizing:border-box}
body{margin:0;font-family:-apple-system,system-ui,sans-serif;background:var(--bg);color:var(--fg)}
header{padding:14px 18px;border-bottom:1px solid #30363d}
header h1{margin:0;font-size:18px}
header small{color:var(--dim)}
main{padding:18px;max-width:780px;margin:0 auto}
.card{background:var(--card);border:1px solid #30363d;border-radius:10px;padding:14px;margin-bottom:14px}
label{display:block;font-size:13px;color:var(--dim);margin:8px 0 4px}
input[type=text],textarea{width:100%;background:#0d1117;color:var(--fg);border:1px solid #30363d;border-radius:8px;padding:8px 10px;font:13px/1.4 ui-monospace,monospace}
textarea{min-height:60px}
.row{display:flex;gap:8px;flex-wrap:wrap}
.row label{display:flex;align-items:center;gap:6px;margin:0;font-size:13px;color:var(--fg)}
button{background:var(--acc);color:#0d1117;border:0;border-radius:8px;padding:10px 16px;font-weight:600;cursor:pointer}
button:disabled{opacity:.5;cursor:default}
pre{white-space:pre-wrap;font:12px/1.5 ui-monospace,monospace;margin:0}
#status{font:12px ui-monospace,monospace;color:var(--dim)}
.err{color:var(--bad)}
</style>
</head>
<body>
<header><h1>lca web</h1><small>local only · closed core does the work</small></header>
<main>
  <div class="card"><div id="status">loading status…</div></div>
  <div class="card">
    <label for="p">Prompt</label>
    <textarea id="p" placeholder='Explain what this project does' />
    <label for="s">Skill (optional)</label>
    <select id="s" style="width:100%;background:#0d1117;color:var(--fg);border:1px solid #30363d;border-radius:8px;padding:8px">
      <option value="">none</option>
      <option>reverse</option><option>ghidra</option><option>debug</option>
      <option>test</option><option>security</option><option>perf</option>
      <option>build</option><option>fuzz</option><option>ctf</option>
      <option>docker</option><option>ml</option>
    </select>
    <div class="row" style="margin-top:10px">
      <label><input type="checkbox" id="par"> parallel <small style="color:var(--dim)">(Pro)</small></label>
      <label><input type="checkbox" id="unl"> unlimited <small style="color:var(--dim)">(Pro)</small></label>
    </div>
    <button id="go" style="margin-top:12px;width:100%">Run → /run</button>
  </div>
  <div class="card" id="out"><pre>idle.</pre></div>
</main>
<script>
async function status(){
  try{
    const r=await fetch("/status"); const d=await r.json();
    document.getElementById("status").textContent=
      `v${d.version} · ${d.tier} · gpu:${d.gpu} · models: ${d.models||"(none)"}`;
  }catch(e){ document.getElementById("status").textContent="status error: "+e; }
}
document.getElementById("go").onclick=async ()=>{
  const btn=document.getElementById("go"); btn.disabled=true;
  const body={prompt:document.getElementById("p").value, skill:document.getElementById("s").value};
  if(document.getElementById("par").checked) body.parallel=true;
  if(document.getElementById("unl").checked) body.unlimited=true;
  document.getElementById("out").querySelector("pre").textContent="running…";
  try{
    const r=await fetch("/run",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(body)});
    document.getElementById("out").querySelector("pre").textContent=(await r.text())||"(no output)";
  }catch(e){ document.getElementById("out").querySelector("pre").textContent="error: "+e; }
  btn.disabled=false;
};
status();
</script>
</body></html>
